<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ملخص البرمجة والذكاء الاصطناعي – تانية ثانوي</title>
<style>
:root{--bg:#f1f0ff;--card:#fff;--tx:#1b1a3a;--mu:#6b6a93;--a:#6a5cff;--b:#00b8d9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0c22;--card:#19183a;--tx:#eeedff;--mu:#a3a2d0}}
:root[data-theme="dark"]{--bg:#0d0c22;--card:#19183a;--tx:#eeedff;--mu:#a3a2d0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,Arial,sans-serif;line-height:1.8}
.hero{text-align:center;padding:36px 16px 10px}
.scene{width:110px;height:110px;margin:10px auto 26px;perspective:500px}
.cube{width:100%;height:100%;position:relative;transform-style:preserve-3d;animation:s 12s linear infinite}
.cube i{position:absolute;width:110px;height:110px;border:2px solid var(--b);background:#6a5cff33;display:flex;align-items:center;justify-content:center;font-size:34px;font-style:normal}
.cube i:nth-child(1){transform:translateZ(55px)}.cube i:nth-child(2){transform:rotateY(180deg) translateZ(55px)}.cube i:nth-child(3){transform:rotateY(90deg) translateZ(55px)}.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(55px)}.cube i:nth-child(5){transform:rotateX(90deg) translateZ(55px)}.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(55px)}
@keyframes s{to{transform:rotateX(360deg) rotateY(360deg)}}
h1{margin:0;font-size:clamp(24px,5vw,40px)}
.sub{color:var(--mu);margin:6px 0 16px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;border-bottom:1px solid #6a5cff33}
input{padding:10px 14px;border-radius:12px;border:1px solid #6a5cff55;background:var(--card);color:var(--tx);font-family:inherit;font-size:15px;min-width:200px}
button{font-family:inherit;border:0;border-radius:12px;padding:9px 14px;cursor:pointer;color:var(--tx);background:var(--card);border:1px solid #6a5cff44;font-size:14px}
button.on{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;border:0}
.w{max-width:880px;margin:auto;padding:14px}
h2{margin:26px 0 8px;color:var(--a)}
.grid{display:grid;gap:16px;perspective:1000px}
.l{background:var(--card);border-radius:18px;padding:16px 20px;transition:transform .15s,box-shadow .2s;border-right:5px solid var(--a);transform-style:preserve-3d}
.l:hover{box-shadow:0 18px 36px #6a5cff44}
.l h3{margin:0;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.l ul{margin:10px 0 0;padding-right:20px;display:none}
.l.o ul{display:block}
.l.d{opacity:.6}
.l.d h3::before{content:"✅ "}
.tg{font-size:13px;color:var(--mu);margin-top:8px}
footer{text-align:center;color:var(--mu);font-size:13px;padding:24px}
</style>
</head>
<body>
<div class="hero"><div class="scene"><div class="cube"><i>🤖</i><i>🔐</i><i>🌐</i><i>🎨</i><i>💻</i><i>📊</i></div></div><h1>ملخص البرمجة والذكاء الاصطناعي</h1><div dir="ltr" style="font-size:24px;font-weight:bold;letter-spacing:6px;color:var(--a);margin-top:6px">EHGOHARY</div><p class="sub">تانية ثانوي – بكالوريا – الترم الأول (الفصول 1 إلى 4)</p></div>
<div class="bar"><input id="q" placeholder="🔍 ابحث (مثلاً: HTTPS أو PDCA)"><span id="tabs"></span></div>
<main class="w" id="m"></main>
<footer>الملخص بصياغة مبسطة من شرح الدروس، من غير حل التمارين. اضغط على الدرس لفتحه، وعلّم "تمت" بعد المراجعة.<div dir="ltr" style="margin-top:14px;font-size:20px;font-weight:bold;letter-spacing:4px;color:var(--a)">EHGOHARY</div></footer>
<script>
const D=[
{c:"الفصل 1: تكنولوجيا المعلومات والمجتمع",l:[
["1-1 تطور تكنولوجيا المعلومات والتحول الاجتماعي",["المراحل: حواسيب ضخمة (ENIAC) ← حواسب شخصية ← الإنترنت والويب ← الهواتف الذكية ← السحابة والبيانات الضخمة والذكاء الاصطناعي.","قانون مور: عدد الترانزستورات في الشريحة يتضاعف تقريبًا كل عامين؛ ملاحظة تاريخية مش قانون فيزيائي ثابت، والتحسين اتجه لتعدد الأنوية والمعالجة المتوازية.","خمسة تحولات: شبكات التواصل، التجارة الإلكترونية، العمل عن بُعد، التعلم عبر الإنترنت، الدفع غير النقدي.","تقنيات ناشئة: القيادة الذاتية، الحوسبة الطرفية (معالجة على الجهاز لتقليل التأخير)، الواقع المعزز والافتراضي، الحوسبة الكمومية (لمسائل محددة مش بديل عام)."]],
["1-2 كيف يعمل الذكاء الاصطناعي",["AI مجال واسع، ML فرع منه يتعلم الأنماط من البيانات بدل برمجة كل قاعدة.","DL أسلوب داخل ML يعتمد على شبكات عصبية متعددة الطبقات وبيانات كبيرة.","GenAI يُنشئ نصوصًا وصورًا وصوتًا جديدة (مثل ChatGPT) وأغلبه يعتمد على DL.","الهلوسة: معلومات غلط بشكل مقنع، فلازم نتحقق من المخرجات."]],
["1-3 الذكاء الاصطناعي في الحياة اليومية والصناعة",["يوميًا: أنظمة التوصية، المساعدات الصوتية، الترجمة الآلية، التعرف على الوجه.","صناعيًا: الصحة (تشخيص بالصور)، الزراعة، التصنيع (صيانة تنبؤية)، اللوجستيات.","يبرع في اكتشاف الأنماط والتنبؤ.","يحتاج حذر: التحيز، الخصوصية، القرارات عالية الأثر، الهلوسة، حقوق المؤلف، مشكلة الصندوق الأسود."]],
["1-4 القضايا الأخلاقية للذكاء الاصطناعي",["التحيز الخوارزمي: نتائج غير عادلة بسبب بيانات متحيزة أو تصميم أو استخدام.","الخصوصية: المراقبة بالتعرف على الوجه والجمع الجماعي للبيانات.","XAI يشرح سبب القرار، المسؤولية توزّع الأدوار، المساءلة تحدد من يُحاسَب.","المبادئ الأربعة: العدالة، الشفافية، حماية الخصوصية، المساءلة."]]]},
{c:"الفصل 2: الأمن السيبراني",l:[
["2-1 تقنيات التشفير والمصادقة",["HTTPS = HTTP فوق TLS: سرية وسلامة وتحقق من هوية الخادم.","مصافحة TLS: شهادة رقمية، اتفاق على مفاتيح جلسة، ثم تشفير متماثل سريع للبيانات.","المفتاح العام والخاص للمصادقة، والتوقيع الرقمي لكشف التلاعب وعدم التنصل.","2FA عاملان من فئتين مختلفتين، MFA عاملان أو أكثر (معرفة، حيازة، سمات حيوية)."]],
["2-2 تصميم أمان الشبكات",["جدار الحماية يسمح أو يمنع حركة المرور بقواعد.","VPN اتصال مشفّر عبر شبكة عامة (عمل عن بُعد وربط فروع).","DMZ منطقة معزولة للخوادم العامة لحماية الشبكة الداخلية.","الدفاع في العمق: طبقات متعددة. Zero Trust: لا ثقة تلقائية، وتفحص الهوية والصلاحيات كل مرة."]],
["2-3 الاستجابة للحوادث وإدارة المخاطر",["الحادث الأمني: تسرب معلومات، تلاعب بالبيانات، انقطاع خدمة.","ست مراحل: التحضير ← الاكتشاف ← الاحتواء ← إزالة التهديد ← الاستعادة ← الدروس المستفادة.","الاحتواء قبل الاستئصال.","درجة الخطر = التأثير × الاحتمالية."]]]},
{c:"الفصل 3: تطبيقات الويب",l:[
["3-1 البنية العامة لتطبيقات الويب",["ثلاث طبقات: واجهة أمامية (ما يراه المستخدم)، واجهة خلفية (معالجة على الخادم)، قاعدة بيانات (تخزين).","مثال البحث: الأمامية تستقبل ← الخلفية تطلب من القاعدة ← ترجع النتائج ← الأمامية تعرضها."]],
["3-2 طرق اتصال تطبيقات الويب",["العميل يطلب والخادم يرد.","HTTPS = HTTP عبر TLS.","GET لطلب بيانات، POST لإرسال بيانات.","رموز الحالة: 200 نجاح، 404 غير موجود، 500 خطأ في الخادم.","API قواعد لطلب بيانات من برنامج آخر، وJSON صيغة تبادل البيانات."]],
["3-3 أساسيات تقنية الواجهة الأمامية",["HTML هيكل، CSS مظهر، JavaScript سلوك.","HTML الدلالي: header وnav وmain وfooter (يفيد قارئ الشاشة ومحركات البحث).","التصميم المتجاوب يناسب كل الشاشات.","أطر العمل: React وVue وNext.js بمكونات جاهزة لتطوير أسرع."]]]},
{c:"الفصل 4: تصميم الويب والوسائط",l:[
["4-1 أنواع الوسائط وخصائصها",["اتجاه واحد: تلفزيون، راديو، صحيفة. اتجاهان: وسائل التواصل الاجتماعي.","الموقع يجمع وسائط ويُحدَّث في أي وقت، لكنه يحتاج غالبًا اتصال شبكة.","اختر الوسيلة حسب الغرض والجمهور، وغالبًا اجمع بين عدة وسائط."]],
["4-2 تصميم المعلومات وتجربة المستخدم",["Persona تمثيل لنمط مستخدمين.","Wireframe مخطط أولي قبل الألوان والزخرفة.","CRAP: تباين، تكرار، محاذاة، تقارب.","UCD: نبدأ من فهم المستخدم، ثم نصمم ونختبر ونكرر."]],
["4-3 طرق تقييم المواقع الإلكترونية",["نوعي (ملاحظة، مقابلات، اختبار قابلية الاستخدام) يفسر الأسباب، وكمي (تحليلات الويب، A/B) يقيس بالأرقام.","PV إجمالي المشاهدات، معدل الارتداد يختلف حسابه بين الأدوات، CVR نسبة تحقيق الإجراء المستهدف.","التقييم الإرشادي: خبراء يراجعون الواجهة (الاتساق، منع الأخطاء، وضوح حالة النظام)."]],
["4-4 عملية التحسين التكراري للمواقع",["PDCA: خطّط ← نفّذ ← تحقّق ← تصرّف.","التفكير التصميمي: التعاطف ← التعريف ← توليد الأفكار ← النموذج الأولي ← الاختبار.","اختبار A/B: نسختان ومقياس محدد وتوزيع عشوائي وعينة كافية."]]]}
];
let S={},ch=-1;
try{S=JSON.parse(localStorage.getItem("ictd")||"{}")}catch(e){}
const sv=()=>{try{localStorage.setItem("ictd",JSON.stringify(S))}catch(e){}};
const tabs=document.getElementById("tabs");
function mk(t,i){const b=document.createElement("button");b.textContent=t;b.onclick=()=>{ch=i;render()};b.dataset.i=i;tabs.appendChild(b)}
mk("الكل",-1);D.forEach((d,i)=>mk("فصل "+(i+1),i));
function render(){const q=document.getElementById("q").value.trim().toLowerCase(),m=document.getElementById("m");m.innerHTML="";
tabs.querySelectorAll("button").forEach(b=>b.className=(+b.dataset.i===ch)?"on":"");
D.forEach((d,ci)=>{if(ch>=0&&ch!==ci)return;
const items=d.l.filter(l=>!q||(l[0]+l[1].join(" ")).toLowerCase().includes(q));if(!items.length)return;
const h=document.createElement("h2");h.textContent=d.c;m.appendChild(h);
const g=document.createElement("div");g.className="grid";
items.forEach(l=>{const k=l[0],c=document.createElement("div");c.className="l"+(S[k]?" d":"")+(q?" o":"");
const t=document.createElement("h3");t.textContent=l[0];t.onclick=()=>c.classList.toggle("o");c.appendChild(t);
const u=document.createElement("ul");l[1].forEach(x=>{const li=document.createElement("li");li.textContent=x;u.appendChild(li)});c.appendChild(u);
const b=document.createElement("button");b.className="tg";b.textContent=S[k]?"إلغاء التعليم":"تمت المراجعة";b.onclick=e=>{e.stopPropagation();S[k]=!S[k];sv();render()};c.appendChild(b);
c.onmousemove=e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`rotateY(${x*6}deg) rotateX(${-y*6}deg)`};c.onmouseleave=()=>c.style.transform="";
g.appendChild(c)});m.appendChild(g)})}
document.getElementById("q").oninput=render;render();
</script>
</body>
</html>
